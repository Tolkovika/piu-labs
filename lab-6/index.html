<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ajax Demo – Lab-6</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <header class="app-header">
        <h1>Ajax Demo – Lab-6</h1>
    </header>

    <main class="container">
        <!-- Przyciski -->
        <div class="controls">
            <button id="btn-fetch" class="btn btn-primary">Pobierz dane</button>
            <button id="btn-error" class="btn btn-danger">Wywołaj błąd</button>
            <button id="btn-reset" class="btn btn-secondary">Resetuj</button>
        </div>

        <!-- Komunikaty błędów -->
        <div id="error-message" class="error-message"></div>

        <!-- Loader -->
        <div id="loader" class="loader">Ładowanie...</div>

        <!-- Lista pobranych elementów -->
        <ul id="items-list" class="items-list"></ul>
    </main>

    <script src="js/ajax.js"></script>
    <script src="js/demo.js"></script>
</body>

</html>
