<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galeria</title>
    <link rel="stylesheet" href="css/galeria.css" />
</head>

<body>
    <header>
        <h1>Galeria</h1>
    </header>

    <main>
        <div class="gallery">
            <figure>
                <img src="img/zachod02.jpg" srcset="img/zachod02.jpg 500w, img/zachod.jpg 1000w"
                    sizes="(max-width: 799px) 100vw, (max-width: 1199px) 100vw, (max-width: 1599px) 50vw, 50vw"
                    alt="Zachód słońca nad morzem" />
                <figcaption>Zachód słońca nad morzem</figcaption>
            </figure>

            <figure>
                <img src="img/krajobraz02.jpg" srcset="img/krajobraz02.jpg 500w, img/krajobraz.jpg 1000w"
                    sizes="(max-width: 799px) 100vw, (max-width: 1199px) 100vw, (max-width: 1599px) 50vw, 50vw"
                    alt="Górski krajobraz w zimie" />
                <figcaption>Górski krajobraz w zimie</figcaption>
            </figure>

            <figure>
                <img src="img/sciezka02.jpg" srcset="img/sciezka02.jpg 500w, img/sciezka.jpg 1000w"
                    sizes="(max-width: 799px) 100vw, (max-width: 1199px) 100vw, (max-width: 1599px) 50vw, 50vw"
                    alt="Leśna ścieżka we mgle" />
                <figcaption>Leśna ścieżka we mgle</figcaption>
            </figure>

            <figure>
                <img src="img/architektura02.jpg" srcset="img/architektura02.jpg 500w, img/architektura.jpg 1000w"
                    sizes="(max-width: 799px) 100vw, (max-width: 1199px) 100vw, (max-width: 1599px) 50vw, 50vw"
                    alt="Architektura współczesna" />
                <figcaption>Architektura współczesna</figcaption>
            </figure>

            <figure>
                <img src="img/kwiat02.jpg" srcset="img/kwiat02.jpg 500w, img/kwiat.jpg 1000w"
                    sizes="(max-width: 799px) 100vw, (max-width: 1199px) 100vw, (max-width: 1599px) 50vw, 50vw"
                    alt="Kwiat w makro" />
                <figcaption>Kwiat w makro</figcaption>
            </figure>

            <figure>
                <img src="img/nocnemiasto02.jpg" srcset="img/nocnemiasto02.jpg 500w, img/nocnemiasto.jpg 1000w"

                    alt="Nocne miasto z świateł" />
                <figcaption>Nocne miasto z świateł</figcaption>
            </figure>

            <figure>
                <img src="img/wodospad02.jpg" srcset="img/wodospad02.jpg 500w, img/wodospad.jpg 1000w"
                    sizes="(max-width: 799px) 100vw, (max-width: 1199px) 100vw, (max-width: 1599px) 50vw, 50vw"
                    alt="Wodospad w parku narodowym" />
                <figcaption>Wodospad w parku narodowym</figcaption>
            </figure>

            <figure>
                <img src="img/pustynia02.jpg" srcset="img/pustynia02.jpg 500w, img/pustynia.jpg 1000w"
                    sizes="(max-width: 799px) 100vw, (max-width: 1199px) 100vw, (max-width: 1599px) 50vw, 50vw"
                    alt="Pustynia o świcie" />
                <figcaption>Pustynia o świcie</figcaption>
            </figure>

            <figure>
                <img src="img/most02.jpg" srcset="img/most02.jpg 500w, img/most.jpg 1000w"
                    sizes="(max-width: 799px) 100vw, (max-width: 1199px) 100vw, (max-width: 1599px) 50vw, 50vw"
                    alt="Most w jesiennych barwach" />
                <figcaption>Most w jesiennych barwach</figcaption>
            </figure>

            <figure>
                <img src="img/jezioro02.jpg" srcset="img/jezioro02.jpg 500w, img/jezioro.jpg 1000w"

                    alt="Jezioro w górach" />

            </figure>

            <figure>
                <img src="img/wschod02.jpg" srcset="img/wschod02.jpg 500w, img/wschod.jpg 1000w"
                    sizes="(max-width: 799px) 100vw, (max-width: 1199px) 100vw, (max-width: 1599px) 50vw, 50vw"
                    alt="Wschód słońca nad polem" />

                <img src="img/uliczka02.jpg" srcset="img/uliczka02.jpg 500w, img/uliczka.jpg 1000w"

                    alt="Uliczka w starym mieście" />
                <figcaption>Uliczka w starym mieście</figcaption>

</html>
